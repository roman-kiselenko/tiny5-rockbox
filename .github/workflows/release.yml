name: Release

# Runs when a version tag is pushed:
#   git tag v0.0.3 && git push origin v0.0.3
#
# It builds the erosqnative firmware and publishes it as
# rockbox-vX.Y.Z.zip on the release for that tag, creating the release if
# the tag has no release yet. The release description comes from
# docs/releases/<tag>.md, one notes file per tag (see docs/RELEASE_NOTES.md);
# if that file does not exist at the tag, a generic description is used, and a
# release you wrote by hand is left alone.

on:
  push:
    tags:
      - "v*"
  # Or run it by hand from the Actions tab, giving it a tag to build.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.0.3"
        required: true
        default: "v0.0.3"

permissions:
  contents: write

jobs:
  firmware:
    name: Build firmware and publish rockbox-<tag>.zip
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Work out the tag and the archive name
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "ASSET=rockbox-${tag}.zip" >> "$GITHUB_ENV"

      # Every tag carries its own notes: docs/releases/<tag>.md. Checked before
      # the build, so a missing file shows up in the log instead of after the
      # release is published.
      - name: Release notes for this tag
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
            echo "Release description: $notes ($(wc -l < release-notes.md) lines)"
            head -3 release-notes.md
          else
            echo "No $notes at ${TAG}; publishing a generic description."
            printf '# Rockbox %s\n\nAutomatic build of `%s` by the Release\nworkflow. Unzip to the root of the SD card (it contains `.rockbox/`).\nBluetooth needs hardware revision 4 (hw4).\n' \
              "$TAG" "$TAG" > release-notes.md
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git perl zip unzip curl wget \
            flex bison texinfo autoconf automake libtool libtool-bin bzip2 xz-utils

      # tools/rockboxdev.sh aborts if any of these is missing; check them
      # first so the failure is obvious instead of "libtool is required".
      - name: Check the tools rockboxdev.sh requires
        run: |
          missing=""
          for t in gcc g++ xz bzip2 gzip make patch makeinfo automake libtool autoconf flex bison; do
            command -v "$t" >/dev/null || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "Missing required tools:$missing"
            exit 1
          fi
          echo "Toolchain prerequisites OK"

      # tools/rockboxdev.sh builds binutils 2.38 and gcc 9.5.0 for mipsel-elf,
      # which takes a long time. Cache it with the downloaded tarballs; change
      # the key if the versions in rockboxdev.sh change.
      - name: Cache the MIPS cross-compiler
        uses: actions/cache@v4
        id: toolchain
        with:
          path: |
            ~/rockbox-toolchain
            ~/.rbdev-dl
          key: mipsel-elf-binutils-2.38-gcc-9.5.0

      - name: Build the MIPS cross-compiler (skipped when cached)
        run: |
          if [ ! -x "$HOME/rockbox-toolchain/bin/mipsel-elf-gcc" ]; then
            RBDEV_PREFIX="$HOME/rockbox-toolchain" \
            RBDEV_TARGET=i \
            RBDEV_DOWNLOAD="$HOME/.rbdev-dl" \
            tools/rockboxdev.sh
          fi
          export PATH="$HOME/rockbox-toolchain/bin:$PATH"
          mipsel-elf-gcc --version

      - name: Build the firmware
        run: |
          export PATH="$HOME/rockbox-toolchain/bin:$PATH"
          mkdir -p build
          cd build
          ../tools/configure --target=erosqnative --type=n
          # No VERSION override: the "Rockbox:" line on the splash is the build
          # revision, and the tag it was cut from is the separate "Tiny5 UI:"
          # line (RBRELEASE, from tools/version.sh --release).
          make -j"$(nproc)"
          make zip
          grep -E 'RBVERSION|RBRELEASE' rbversion.h

      - name: Check the archive
        run: |
          unzip -l build/rockbox.zip | head -20
          echo "entries under .rockbox: $(unzip -l build/rockbox.zip | grep -c '.rockbox/')"
          unzip -l build/rockbox.zip | grep -E "rockbox\.elf|\.fnt"

      - name: Name the archive rockbox-vX.Y.Z.zip
        run: |
          mv build/rockbox.zip "$ASSET"
          ls -l "$ASSET"
          sha256sum "$ASSET" | tee sha256sum.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            body="$(gh release view "$TAG" --json body -q .body)"
            # Only overwrite text this workflow wrote, or an empty body: a
            # description typed by hand stays untouched.
            if [ -z "$body" ] || printf '%s' "$body" | head -1 | grep -q "Automatic build of"; then
                gh release edit "$TAG" --notes-file release-notes.md
                echo "Description updated from docs/releases/${TAG}.md"
            else
                echo "Keeping the hand-written description of $TAG"
            fi
          else
            gh release create "$TAG" --title "Rockbox Tiny5 ${TAG}" $prerelease \
                --notes-file release-notes.md
            echo "Created release $TAG from docs/releases/${TAG}.md"
          fi

      - name: Upload the archive
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release upload "$TAG" "$ASSET" --clobber
          echo "Published ${ASSET}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "sha256: $(cat sha256sum.txt)"
